app = "pdf-extractor-backend"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# PDF parsing + image/OCR work is memory-hungry. Give the machine at least 1 GB.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
