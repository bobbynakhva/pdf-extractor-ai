[project]
name = "pdf-extractor-backend"
version = "0.1.0"
description = "PDF Data Extraction — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=5.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    # Converts the PDF to a Word .docx preserving layout, fonts, tables,
    # and images. Built on top of PyMuPDF, so we don't add a new engine —
    # just a thin export step on the bytes we already cache.
    "pdf2docx>=0.5.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
